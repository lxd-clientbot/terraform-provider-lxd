name: LXD Client Update

on:
  repository_dispatch:
    types: [lxd-client-updated]
  workflow_dispatch:
    inputs:
      sha:
        description: "LXD commit SHA to update to"
        required: true
      ref:
        description: "LXD branch/ref (e.g., refs/heads/main)"
        required: true
      model:
        description: "OpenRouter model ID (overrides vars.OPENROUTER_MODEL)"
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lxd-client-update
  cancel-in-progress: true

env:
  LXD_MODULE: github.com/canonical/lxd

jobs:
  update-client:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve inputs
        id: inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          DISPATCH_REPO: ${{ github.event.client_payload.repository }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          INPUT_MODEL: ${{ github.event.inputs.model }}
          VARS_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          if [ "${EVENT_NAME}" = "repository_dispatch" ]; then
            SHA="${DISPATCH_SHA}"
            REF="${DISPATCH_REF}"
            REPO="${DISPATCH_REPO}"
          else
            SHA="${INPUT_SHA}"
            REF="${INPUT_REF}"
            REPO="canonical/lxd"
          fi

          # Resolve model: workflow_dispatch input > vars.OPENROUTER_MODEL
          MODEL="${INPUT_MODEL}"
          if [ -z "${MODEL}" ]; then
            MODEL="${VARS_MODEL}"
          fi
          if [ -z "${MODEL}" ]; then
            echo "::error::No model configured. Set vars.OPENROUTER_MODEL or provide a model input."
            exit 1
          fi

          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "repository=${REPO}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "model=${MODEL}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          token: ${{ secrets.PR_OPEN_TOKEN }}

      - name: Configure Git
        env:
          GH_TOKEN: ${{ secrets.PR_OPEN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "Canonical LXD Bot"
          git config user.email "lxd@lists.canonical.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --quiet requests

      - name: Update LXD dependency
        run: |
          echo "Updating ${LXD_MODULE} to main"
          go get "${LXD_MODULE}@main"
          go mod tidy

      - name: Initial build check
        id: build
        run: |
          set +e
          go build ./... 2>&1 | tee build-errors.txt
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          if [ ${BUILD_EXIT} -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
            echo "Build succeeded — no code changes needed."
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
            echo "Build failed — AI fix required."
          fi

      - name: Fetch LXD client diff
        if: steps.build.outputs.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.PR_OPEN_TOKEN }}
          LXD_REPO: ${{ steps.inputs.outputs.repository }}
          LXD_SHA: ${{ steps.inputs.outputs.sha }}
        run: |
          # Fetch the commit diff from GitHub API, filtered to client/ paths.
          gh api "/repos/${LXD_REPO}/commits/${LXD_SHA}" \
            --header "Accept: application/vnd.github.diff" \
            | awk '/^diff --git a\/client\// { found=1 } found { print } /^diff --git/ && !/^diff --git a\/client\// { found=0 }' \
            > lxd-client-diff.txt

          if [ ! -s lxd-client-diff.txt ]; then
            echo "No client/ changes found in commit. Fetching full diff as fallback."
            gh api "/repos/${LXD_REPO}/commits/${LXD_SHA}" \
              --header "Accept: application/vnd.github.diff" \
              > lxd-client-diff.txt
          fi

          echo "LXD client diff size: $(wc -c < lxd-client-diff.txt) bytes"

      - name: Run AI fix agent
        if: steps.build.outputs.result == 'failure'
        id: ai-fix
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ steps.inputs.outputs.model }}
          BUILD_ERRORS_FILE: build-errors.txt
          LXD_CLIENT_DIFF_FILE: lxd-client-diff.txt
          MAX_ITERATIONS: "5"
        run: |
          set +e
          python .github/scripts/agentic_fix.py
          AI_EXIT=$?
          set -e

          if [ ${AI_EXIT} -eq 0 ]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "result=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch and commit
        id: branch
        env:
          SHA_SHORT: ${{ steps.inputs.outputs.sha_short }}
          LXD_SHA: ${{ steps.inputs.outputs.sha }}
          LXD_REF: ${{ steps.inputs.outputs.ref }}
        run: |
          BRANCH="lxd-client-update/${SHA_SHORT}"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"

          git checkout -b "${BRANCH}"
          git add -A
          git reset -- build-errors.txt lxd-client-diff.txt fix-summary.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          git commit -m "api: update LXD client to ${SHA_SHORT}

          Update github.com/canonical/lxd dependency to commit ${LXD_SHA}.
          Source ref: ${LXD_REF}

          Co-authored-by: Canonical LXD Bot <lxd@lists.canonical.com>"

          git push origin "${BRANCH}" --force

      - name: Open draft PR
        if: steps.branch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_OPEN_TOKEN }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          SHA_SHORT: ${{ steps.inputs.outputs.sha_short }}
          LXD_SHA: ${{ steps.inputs.outputs.sha }}
          LXD_REF: ${{ steps.inputs.outputs.ref }}
          LXD_REPO: ${{ steps.inputs.outputs.repository }}
          AI_MODEL: ${{ steps.inputs.outputs.model }}
          BUILD_RESULT: ${{ steps.build.outputs.result }}
          AI_RESULT: ${{ steps.ai-fix.outputs.result }}
        run: |
          EXISTING=$(gh pr list --head "${BRANCH_NAME}" --json number --jq '.[0].number' 2>/dev/null || true)

          if [ -n "${EXISTING}" ]; then
            echo "PR #${EXISTING} already exists for branch ${BRANCH_NAME}. Skipping creation."
            exit 0
          fi

          # Build PR body.
          BODY_FILE=$(mktemp)

          cat > "${BODY_FILE}" <<-HEADER
          ## LXD Client Update

          This PR updates the \`github.com/canonical/lxd\` dependency to accommodate upstream client SDK changes.

          **LXD commit:** [\`${SHA_SHORT}\`](https://github.com/${LXD_REPO}/commit/${LXD_SHA})
          **LXD ref:** \`${LXD_REF}\`
          **AI model:** \`${AI_MODEL}\`
          HEADER

          echo "" >> "${BODY_FILE}"

          if [ "${BUILD_RESULT}" = "success" ]; then
            echo "### ✅ Build passed" >> "${BODY_FILE}"
            echo "No code changes were needed — this is a dependency-only bump." >> "${BODY_FILE}"
          elif [ "${AI_RESULT}" = "success" ]; then
            echo "### ✅ AI fix applied successfully" >> "${BODY_FILE}"
            echo "The AI agent fixed the build errors caused by the LXD client update." >> "${BODY_FILE}"
          else
            echo "### ⚠️ AI fix incomplete" >> "${BODY_FILE}"
            echo "The AI agent was unable to fully resolve all build errors after 5 iterations." >> "${BODY_FILE}"
            echo "**Manual review and fixes are required.**" >> "${BODY_FILE}"
            echo "" >> "${BODY_FILE}"
            echo "<details><summary>Remaining build errors</summary>" >> "${BODY_FILE}"
            echo "" >> "${BODY_FILE}"
            echo '```' >> "${BODY_FILE}"
            cat build-errors.txt >> "${BODY_FILE}"
            echo '```' >> "${BODY_FILE}"
            echo "</details>" >> "${BODY_FILE}"
          fi

          if [ -f fix-summary.md ]; then
            echo "" >> "${BODY_FILE}"
            echo "---" >> "${BODY_FILE}"
            echo "" >> "${BODY_FILE}"
            cat fix-summary.md >> "${BODY_FILE}"
          fi

          gh pr create \
            --draft \
            --base main \
            --head "${BRANCH_NAME}" \
            --title "api: update LXD client to ${SHA_SHORT}" \
            --body-file "${BODY_FILE}"
